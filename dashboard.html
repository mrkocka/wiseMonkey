<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Wise Monky | Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet" />
</head>

<body class="page-dashboard">
    <main class="dashboard-shell">
        <section class="dashboard-header">
            <div class="brand">
                <img src="/img/Logo.png" alt="Wise Monky logo" />
                <div>
                    <h1 class="dashboard-title">A Bölcs Majom</h1>
                    <p class="dashboard-subtitle"></p>
                </div>
            </div>

            <div class="header-actions">
                <a class="button button-primary" href="#">Uj idezet feltoltese</a>
                <a class="button button-secondary" href="/logout">Kijelentkezes</a>
            </div>
        </section>

        <section class="dashboard-card">
            <div class="card-head">
                <div>
                    <h2>Idézet Gyüjtemény</h2>
                </div>
            </div>

            <div class="table-wrap">
                <table class="dashboard-table">
                    <thead>
                        <tr>
                            <th>Azonosito</th>
                            <th>Idezet</th>
                            <th>Szerzo</th>
                            <th>Muveletek</th>
                        </tr>
                    </thead>
                    <tbody id="quotes-table-body">
                        <tr>
                            <td colspan="4" class="table-message">Az idezetek betoltese folyamatban van...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="./js/dashboard.js"></script>
</body>

</html>
