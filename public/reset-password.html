<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <title>Wise Monky | Új jelszó beállítása</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body class="page-login">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-box">
                <div class="logo-fallback">
                    <img src="/img/Logo.png" alt="majom logó">
                </div>
            </div>

            <form action="/reset-password" method="post" id="reset-password-form">
                <input type="hidden" id="token" name="token" value="">

                <div class="field">
                    <label for="password">Új jelszó</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>

                <div class="field">
                    <label for="confirm-password">Új jelszó megerősítése</label>
                    <input type="password" id="confirm-password" name="confirmPassword" minlength="8" required>
                </div>

                <p class="login-help">
                    A visszaállító link csak korlátozott ideig érvényes, ezért érdemes az új jelszót azonnal beállítani.
                </p>

                <p class="login-error" id="reset-password-message"></p>

                <button type="submit" class="login-btn" id="reset-password-submit">Új jelszó mentése</button>
            </form>

            <p class="footer-text">
                <a href="/banan" id="login-back-link">Vissza a belépéshez</a>
            </p>
        </div>
    </div>
    <script src="/app-config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const status = params.get("status");
        const form = document.getElementById("reset-password-form");
        const tokenInput = document.getElementById("token");
        const messageBox = document.getElementById("reset-password-message");
        const submitButton = document.getElementById("reset-password-submit");
        const loginBackLink = document.getElementById("login-back-link");
        const loginRoute = window.WISE_MONKEY_CONFIG?.loginRoute || "/banan";

        loginBackLink.href = loginRoute;

        function disableResetForm() {
            tokenInput.value = "";
            submitButton.disabled = true;
            form.querySelectorAll("input[type='password']").forEach((input) => {
                input.disabled = true;
            });
        }

        if (token) {
            tokenInput.value = token;
        }

        if (!token && status !== "done" && status !== "db") {
            messageBox.textContent = "A visszaállító link érvénytelen vagy lejárt.";
            messageBox.classList.add("is-visible");
            disableResetForm();
        } else if (status === "invalid") {
            messageBox.textContent = "A visszaállító link érvénytelen vagy lejárt.";
            messageBox.classList.add("is-visible");
            disableResetForm();
        } else if (status === "mismatch") {
            messageBox.textContent = "A két jelszó nem egyezik.";
            messageBox.classList.add("is-visible");
        } else if (status === "short") {
            messageBox.textContent = "Az új jelszó legyen legalább 8 karakter hosszú.";
            messageBox.classList.add("is-visible");
        } else if (status === "db") {
            messageBox.textContent = "Adatbázis hiba miatt a jelszó-visszaállítás jelenleg nem érhető el.";
            messageBox.classList.add("is-visible");
            disableResetForm();
        } else if (status === "done") {
            messageBox.textContent = "Az új jelszó elmentve. Most már be tudsz lépni.";
            messageBox.classList.add("is-visible", "is-success");
            disableResetForm();
        }
    </script>
</body>

</html>
