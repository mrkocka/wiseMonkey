<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Wise Monky | Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet" />
</head>

<body class="page-dashboard">
    <main class="dashboard-shell">
        <section class="dashboard-header">
            <div class="brand">
                <img src="/img/Logo.png" alt="Wise Monky logo" />
                <div>
                    <h1 class="dashboard-title">A Bölcs Majom</h1>
                    <p class="dashboard-subtitle"></p>
                </div>
            </div>

            <div class="header-actions">
                <button id="open-quote-modal" class="button button-primary" type="button">Új idézet feltöltése</button>
                <a class="button button-secondary" href="/logout">Kijelentkezés</a>
            </div>
        </section>

        <section class="dashboard-card">
            <div class="card-head">
                <div>
                    <h2>Idézet Gyűjtemény</h2>
                </div>
            </div>

            <div class="table-wrap">
                <table class="dashboard-table">
                    <thead>
                        <tr>
                            <th>Azonosító</th>
                            <th>Idézet</th>
                            <th>Szerző</th>
                            <th>Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="quotes-table-body">
                        <tr>
                            <td colspan="4" class="table-message">Az idézetek betöltése folyamatban van...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <div id="quote-modal" class="modal-overlay is-hidden" aria-hidden="true">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="quote-modal-title">
            <div class="modal-head">
                <div>
                    <h2 id="quote-modal-title">Új idézet feltöltése</h2>
                    <p>Töltsd ki az idézet szövegét és a szerző nevét, hogy az adatbázisba kerüljön.</p>
                </div>
                <button id="close-quote-modal" class="modal-close" type="button" aria-label="Ablak bezárása">×</button>
            </div>

            <form id="quote-form" class="modal-form">
                <input id="quote-id-input" name="quoteId" type="hidden" />
                <div class="field">
                    <label for="quote-text-input">Idézet</label>
                    <textarea id="quote-text-input" name="quoteText" rows="5" maxlength="500" required></textarea>
                </div>

                <div class="field">
                    <label for="quote-author-input">Szerző</label>
                    <input id="quote-author-input" name="author" type="text" maxlength="120" required />
                </div>

                <p id="quote-form-message" class="form-message" aria-live="polite"></p>

                <div class="modal-actions">
                    <button class="button button-primary" id="submit-quote-button" type="submit">Idézet mentése</button>
                    <button class="button button-secondary" type="button" id="cancel-quote-modal">Mégse</button>
                </div>
            </form>
        </section>
    </div>
    <div id="delete-modal" class="modal-overlay is-hidden" aria-hidden="true">
        <section class="modal-card modal-card-small" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
            <div class="modal-head">
                <div>
                    <h2 id="delete-modal-title">Idézet törlése</h2>
                    <p id="delete-modal-description">Biztosan törölni szeretnéd ezt az idézetet?</p>
                </div>
                <button id="close-delete-modal" class="modal-close" type="button" aria-label="Ablak bezárása">×</button>
            </div>

            <p id="delete-modal-quote-preview" class="delete-quote-preview"></p>
            <p id="delete-form-message" class="form-message" aria-live="polite"></p>

            <div class="modal-actions">
                <button class="button button-delete" id="confirm-delete-button" type="button">Törlés megerősítése</button>
                <button class="button button-secondary" id="cancel-delete-button" type="button">Mégse</button>
            </div>
        </section>
    </div>
    <script src="./js/dashboard.js"></script>
</body>

</html>
