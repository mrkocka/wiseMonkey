<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <title>Wise Monky | Jelszó-visszaállítás</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body class="page-login">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-box">
                <div class="logo-fallback">
                    <img src="/img/Logo.png" alt="majom logó">
                </div>
            </div>

            <form action="/forgot-password" method="post">
                <div class="field">
                    <label for="email">E-mail cím</label>
                    <input type="email" id="email" name="email" placeholder="pelda@domain.hu" required>
                </div>

                <p class="login-help">
                    Add meg a felhasználóhoz tartozó e-mail címet, és küldünk egy időkorlátos visszaállító linket.
                </p>

                <p class="login-error" id="forgot-password-message"></p>

                <button type="submit" class="login-btn">Visszaállító link küldése</button>
            </form>

            <p class="footer-text">
                <a href="/banan" id="login-back-link">Vissza a belépéshez</a>
            </p>
        </div>
    </div>
    <script src="/app-config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");
        const messageBox = document.getElementById("forgot-password-message");
        const loginBackLink = document.getElementById("login-back-link");
        const loginRoute = window.WISE_MONKEY_CONFIG?.loginRoute || "/banan";

        loginBackLink.href = loginRoute;

        if (status === "sent") {
            messageBox.textContent = "Ha létezik ilyen e-mail címmel felhasználó, elküldtük a visszaállító linket.";
            messageBox.classList.add("is-visible", "is-success");
        } else if (status === "db") {
            messageBox.textContent = "Adatbázis hiba miatt a visszaállítás jelenleg nem érhető el.";
            messageBox.classList.add("is-visible");
        }
    </script>
</body>

</html>
